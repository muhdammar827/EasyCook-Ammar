<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCook - My Meal Planner</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <img src="css/logo.JPG" alt="logo">

        <nav>
            <a href="index.html">Recipe Explorer</a>
            <a href="converter.html">Unit Converter</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <h1 style="text-align: center;">Kitchen Unit Converter</h1>

        <!-- Kitchen Unit Converter Section -->
        <section>

            <p>
                Convert common cooking measurements, including milligrams, grams,
                kilograms, millilitres, litres, teaspoons,
                tablespoons, and cups.
            </p>

            <div class="converter">

                <!-- Enter Value -->
                <label for="conversionValue">Enter Value:</label>

                <input
                    type="number"
                    id="conversionValue"
                    min="0"
                    step="any"
                    placeholder="Enter a value"
                >


                <!-- From Unit -->
                <label for="fromUnit">From:</label>

                <select id="fromUnit">
                    <option value="mg">Milligrams (mg)</option>
                    <option value="g" selected>Grams (g)</option>
                    <option value="kg">Kilograms (kg)</option>
                    <option value="ml">Millilitres (ml)</option>
                    <option value="L">Litres (L)</option>
                    <option value="tsp">Teaspoons (tsp)</option>
                    <option value="tbsp">Tablespoons (tbsp)</option>
                    <option value="cup">Cups (cup)</option>
                </select>


                <!-- To Unit -->
                <label for="toUnit">To:</label>

                <select id="toUnit">
                    <option value="mg">Milligrams (mg)</option>
                    <option value="g">Grams (g)</option>
                    <option value="kg" selected>Kilograms (kg)</option>
                    <option value="ml">Millilitres (ml)</option>
                    <option value="L">Litres (L)</option>
                    <option value="tsp">Teaspoons (tsp)</option>
                    <option value="tbsp">Tablespoons (tbsp)</option>
                    <option value="cup">Cups (cup)</option>
                </select>


                <!-- Convert Button -->
                <button type="button" id="convertButton">
                    Convert
                </button>


                <!-- Conversion Result -->
                <p id="conversionResult" aria-live="polite">
                    Your conversion result will appear here.
                </p>

            </div>
        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 EasyCook Recipe Dictionary</p>
    </footer>


    <!-- JavaScript -->
    <script src="js/converter.js"></script>

</body>
</html>
